@if (logoUrl(); as url) {
  <img
    class="merchant-logo"
    [src]="url"
    [alt]="merchant() ?? ''"
    [title]="merchant() ?? ''"
    loading="lazy"
    (error)="onLogoError()"
  />
} @else if (initials(); as text) {
  <span class="merchant-initials" [style.background]="initialsColor()" [title]="merchant() ?? ''">{{ text }}</span>
} @else {
  <span class="merchant-name">—</span>
}
