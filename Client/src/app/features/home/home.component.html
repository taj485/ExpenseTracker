@if (!checking()) {
  <div class="landing">

    <nav class="marketing-nav">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div class="brand-name"><span class="wordmark-lead">Receipt</span><span class="wordmark-tail">Cave</span></div>
      </div>
      <div class="marketing-links">
        <span class="marketing-link">How it works</span>
        <span class="marketing-link">Features</span>
        <span class="marketing-link">Pricing</span>
      </div>
      <div class="marketing-actions">
        <button type="button" class="btn btn-secondary btn-sm" (click)="login()">Log in</button>
        <button type="button" class="btn btn-primary btn-sm" (click)="login()">Get started</button>
      </div>
    </nav>

    <app-landing-hero (getStarted)="login()" />
    <app-landing-features />
    <app-landing-insights />
    <app-landing-steps />

    <!-- Final CTA -->
    <section class="final-cta">
      <h2 class="final-title">Start with your next receipt</h2>
      <p class="final-blurb">Set up a space, scan one receipt, and see the whole thing filled in for you.</p>
      <div class="final-actions">
        <button class="btn btn-on-brand">Get started free</button>
        <button type="button" class="btn btn-ghost-on-brand" (click)="login()">Log in</button>
      </div>
    </section>

    <footer class="marketing-foot">
      <span>&copy; 2026 ReceiptCave</span>
      <span>Privacy &middot; Terms &middot; Contact</span>
    </footer>

  </div>
}
