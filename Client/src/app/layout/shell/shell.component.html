@if (expenseTableService.loaded() && expenseTableService.tables().length === 0) {
  <app-create-expense-table-prompt />
} @else {
  <div class="app">
    <div class="sidebar-overlay" [class.open]="sidebarOpen()" (click)="sidebarOpen.set(false)"></div>

    <app-sidebar [isOpen]="sidebarOpen()" (close)="sidebarOpen.set(false)" />

    <div class="main-wrapper">
      <app-topbar
        [pageTitle]="pageTitle()"
        (menuClicked)="sidebarOpen.set(true)"
      />

      <div class="content">
        <div class="page-area">
          <router-outlet (activate)="onRouteActivated($event)" />
        </div>

        <!-- Add Expense panel — desktop -->
        <aside class="add-panel">
          <button type="button" class="btn-upload-receipt" (click)="uploadDrawer.open()">📷 Upload Receipt</button>
          <app-add-expense-form (submitted)="drawer.close()" />
        </aside>
      </div>

      <!-- Bottom tab bar — mobile. Scanning takes the raised centre slot: it is
           the headline action, and it used to be a plain "Receipt" tab. -->
      <div class="mobile-footer">
        <a class="tab-item" routerLink="/dashboard" routerLinkActive="active">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M11.36 2.79a1 1 0 0 1 1.28 0l8.5 7.1a1 1 0 0 1 .36.77V20a2 2 0 0 1-2 2h-4.25v-5.7a1.25 1.25 0 0 0-1.25-1.25h-3.6a1.25 1.25 0 0 0-1.25 1.25V22H4.5a2 2 0 0 1-2-2v-9.34a1 1 0 0 1 .36-.77z"/>
          </svg>
          <span class="tab-label">Home</span>
        </a>

        <button type="button" class="tab-item" [class.active]="tablePickerDrawer.isOpen()" (click)="onExpensesTabClick()">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="4.7" cy="6.5" r="1.7"/><circle cx="4.7" cy="12" r="1.7"/><circle cx="4.7" cy="17.5" r="1.7"/>
            <rect x="8.6" y="5.3" width="11.6" height="2.4" rx="1.2"/>
            <rect x="8.6" y="10.8" width="11.6" height="2.4" rx="1.2"/>
            <rect x="8.6" y="16.3" width="11.6" height="2.4" rx="1.2"/>
          </svg>
          <span class="tab-label">Expenses</span>
        </button>

        <button type="button" class="tab-scan" [class.active]="uploadDrawer.isOpen()" (click)="uploadDrawer.open()">
          <span class="tab-scan-button">
            <svg class="tab-scan-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M2.8 10V6.2A3.4 3.4 0 0 1 6.2 2.8H10v2.5H6.2a.9.9 0 0 0-.9.9V10z"/>
              <path d="M21.2 10V6.2a3.4 3.4 0 0 0-3.4-3.4H14v2.5h3.8a.9.9 0 0 1 .9.9V10z"/>
              <path d="M21.2 14v3.8a3.4 3.4 0 0 1-3.4 3.4H14v-2.5h3.8a.9.9 0 0 0 .9-.9V14z"/>
              <path d="M2.8 14v3.8a3.4 3.4 0 0 0 3.4 3.4H10v-2.5H6.2a.9.9 0 0 1-.9-.9V14z"/>
              <path fill-rule="evenodd" clip-rule="evenodd" d="M8.5 7.3h7v9.4l-1.75-1.2-1.75 1.2-1.75-1.2L8.5 16.7zm1.7 2.5h3.6v1.3h-3.6zm0 2.4h2.4v1.3h-2.4z"/>
            </svg>
          </span>
          <span class="tab-scan-label">Scan</span>
        </button>

        <button type="button" class="tab-item" [class.active]="drawer.isOpen()" (click)="drawer.open()">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.4a9.6 9.6 0 1 0 0 19.2 9.6 9.6 0 0 0 0-19.2m1.2 5.3a1.2 1.2 0 0 0-2.4 0v3.1H7.7a1.2 1.2 0 0 0 0 2.4h3.1v3.1a1.2 1.2 0 0 0 2.4 0v-3.1h3.1a1.2 1.2 0 0 0 0-2.4h-3.1z"/>
          </svg>
          <span class="tab-label">Add</span>
        </button>

        <button type="button" class="tab-item" (click)="sidebarOpen.set(true)">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 7.2a3 3 0 0 1 3-3h3.1a2 2 0 0 1 1.5.7l1 1.1H18a3 3 0 0 1 3 3v.5H3z"/>
            <path d="M3 11h18v6.8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/>
          </svg>
          <span class="tab-label">Spaces</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Add Expense drawer — mobile -->
  @if (drawer.isOpen()) {
    <div class="drawer-overlay" (click)="drawer.close()">
      <div class="drawer" appDragToDismiss (dismissed)="drawer.close()" (click)="$event.stopPropagation()">
        <div class="drawer-handle"></div>
        <app-add-expense-form (submitted)="drawer.close()" />
      </div>
    </div>
  }

  <!-- Upload Receipt drawer — mobile -->
  @if (uploadDrawer.isOpen()) {
    <div class="drawer-overlay" (click)="uploadDrawer.close()">
      <div class="drawer" appDragToDismiss (dismissed)="uploadDrawer.close()" (click)="$event.stopPropagation()">
        <div class="drawer-handle"></div>
        <app-upload-receipt (submitted)="uploadDrawer.close()" />
      </div>
    </div>
  }

  <!-- Expense Table picker drawer — mobile -->
  @if (tablePickerDrawer.isOpen()) {
    <div class="drawer-overlay" (click)="tablePickerDrawer.close()">
      <div class="drawer" appDragToDismiss (dismissed)="tablePickerDrawer.close()" (click)="$event.stopPropagation()">
        <div class="drawer-handle"></div>
        <app-expense-table-picker (selected)="tablePickerDrawer.close()" />
      </div>
    </div>
  }

  <!-- Create Expense Table dialog -->
  @if (createTableDialogService.isOpen()) {
    <app-create-expense-table-prompt
      [dismissible]="true"
      (created)="createTableDialogService.close()"
      (cancelled)="createTableDialogService.close()"
    />
  }
}
