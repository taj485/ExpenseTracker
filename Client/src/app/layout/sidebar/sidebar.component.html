<aside class="sidebar" [class.open]="isOpen">
  <a class="sidebar-brand" routerLink="/dashboard">
    <span class="brand-mark">R</span>
    <span class="brand-name"><span class="wordmark-lead">Re</span><span class="wordmark-tail">cave</span></span>
  </a>

  <nav class="sidebar-nav">
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" (click)="close.emit()">
      <svg class="nav-glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="2.2" />
        <rect x="13" y="3" width="8" height="8" rx="2.2" />
        <rect x="3" y="13" width="8" height="8" rx="2.2" />
        <rect x="13" y="13" width="8" height="8" rx="2.2" />
      </svg>
      Dashboard
    </a>

    <div class="nav-heading">Spaces</div>

    @for (table of expenseTableService.tables(); track table.id) {
      <!-- The star is a sibling of the link, not inside it: nested interactive elements are invalid HTML. -->
      <div class="nav-space-row">
        <a class="nav-item nav-space-link" [routerLink]="['/expenses/table', table.id]" routerLinkActive="active" (click)="close.emit()">
          <svg class="nav-glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 7.2a3 3 0 0 1 3-3h3.1a2 2 0 0 1 1.5.7l1 1.1H18a3 3 0 0 1 3 3v.5H3z" />
            <path d="M3 11h18v6.8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" />
          </svg>
          <span class="nav-name">{{ table.name }}</span>
          @if (spaceCount(table.id); as count) {
            <span class="nav-count" [attr.aria-label]="count + ' expenses'">{{ count }}</span>
          }
        </a>
        <button type="button" class="nav-star" [class.is-starred]="table.isStarred"
                [disabled]="expenseTableService.tables().length === 1"
                [attr.aria-label]="(table.isStarred ? 'Unstar ' : 'Star ') + table.name"
                [attr.aria-pressed]="table.isStarred"
                (click)="toggleStar(table)">
          {{ table.isStarred ? '★' : '☆' }}
        </button>
      </div>
    }

    <button type="button" class="btn-add-space" (click)="createTableDialogService.open()">
      + New space
    </button>
  </nav>

  <div class="sidebar-footer">Recave v1.0</div>
</aside>
