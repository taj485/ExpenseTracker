server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Receipt uploads are images; nginx's 1m default would 413 them.
    client_max_body_size 25m;

    # Same-origin API. Resolved per-request through Docker's embedded DNS via a
    # variable, so this container still starts when the api service is down —
    # a literal proxy_pass host is resolved once at startup and fails hard.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular hashes its build output, so those files can be cached hard.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading an old bundle
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths are Angular routes, not 404s.
    # Equivalent to navigationFallback in public/staticwebapp.config.json.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
